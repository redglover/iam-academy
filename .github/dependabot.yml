version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-patch-minor:
        update-types: [patch, minor]
    ignore:
      # Major versions are upgraded by hand: they often need code or setup changes
      # (e.g. Tailwind 4, newer Vite, React Router 7) and testing in the browser.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
